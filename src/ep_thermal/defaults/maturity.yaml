# Vitrinite reflectance from a temperature history: the EASY%Ro kinetics (20 parallel first-order reactions).
# Source: Sweeney and Burnham (1990, AAPG Bulletin 74, pp. 1559-1570), as transcribed in an open-source basin-modelling code; the paper itself has not been read here.
# Level: published, assumed valid for use (owner decision of 2026-11-14); to be verified by reproducing the printed table of the paper and against measured Ro.

easyro:
  activation_energy_kcal_mol: [34, 36, 38, 40, 42, 44, 46, 48, 50, 52, 54, 56, 58, 60, 62, 64, 66, 68, 70, 72]
  weights: [0.03, 0.03, 0.04, 0.04, 0.05, 0.05, 0.06, 0.04, 0.04, 0.07, 0.06, 0.06, 0.06, 0.05, 0.05, 0.04, 0.03, 0.02, 0.02, 0.01]     # sum 0.85
  frequency_factor_per_s: 1.0e13
  gas_constant_cal_mol_k: 1.987
  ro_intercept: -1.6          # Ro (per cent) = exp(ro_intercept + ro_slope F); the lower limit is exp(-1.6) = 0.202 per cent
  ro_slope: 3.7               # at full conversion (F = 0.85) the upper limit is 4.69 per cent

numerics:
  integral_complete_above: 220.0     # a reaction integral above this is treated as complete
  integral_none_below: 1.0e-20       # and below this as not started
  isothermal_tolerance_k: 1.0e-9     # a step with a temperature change below this is isothermal and uses the direct rate, not the temperature integral
