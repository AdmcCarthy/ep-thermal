# Thermal conductivity of rock-forming components and of rock types, at surface temperature.
# Source: Allen and Allen (2005), Basin Analysis, 2nd edition, Table 9.2 (in part after Brigaud and Vasseur 1989). Level: published, assumed valid for use
# (owner decision of 2026-11-14), to be verified against measured conductivity when it is available.
# Conductivity FALLS with temperature; these values are for surface temperature, so a deep-basin estimate needs a temperature correction that is not made here.

components_w_per_mk:          # W/(m K)
  water: 0.6
  quartz: 7.7
  calcite: 3.3
  dolomite: 5.3               # mineral; Table 2.1 of the same book gives dolomite ROCK as 3.2 to 5, so the two tables disagree on this row
  anhydrite: 6.3
  kaolinite: 2.6
  chlorite: 3.3
  illite_smectite: 1.9
  clay: 2.0                   # the clay end member used in the book's plot of sandstone conductivity against clay content (Fig. 9.13a)

rock_ranges_w_per_mk:         # [low, high], W/(m K): ranges, not means; the width reflects porosity, clay content and fabric
  shale: [1.2, 3.0]
  sandstone: [1.5, 4.2]
  limestone: [2.0, 3.4]
  dolomite: [3.2, 3.5]
  gneiss: [2.1, 4.2]
  basalt: [1.3, 2.9]
  granite: [2.4, 3.8]
  gabbro: [1.9, 4.0]
  peridotite: [3.0, 4.5]

mixing:
  fraction_sum_tolerance: 1.0e-6   # volume fractions must sum to one within this, else the result is missing (nothing is renormalised silently)
